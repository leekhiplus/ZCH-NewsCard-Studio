# ZCH NewsCard Studio – GitHub Actions build
# Put this file in your repository at:  .github/workflows/android.yml
# It works whether you upload the project as a ZIP (no need to extract) or as normal files.
name: Build ZCH NewsCard Studio

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Locate project (unzip automatically if a ZIP was uploaded)
        run: |
          set -e
          if [ -f settings.gradle.kts ]; then
            PROJ="$(pwd)"
          else
            ZIP="$(ls -1 *.zip 2>/dev/null | head -n1 || true)"
            if [ -z "$ZIP" ]; then echo "::error::No project ZIP and no settings.gradle.kts found in repository root"; exit 1; fi
            echo "Extracting $ZIP"
            mkdir -p _project
            unzip -q -o "$ZIP" -d _project
            S="$(find _project -name settings.gradle.kts -not -path '*/node_modules/*' | head -n1)"
            if [ -z "$S" ]; then echo "::error::settings.gradle.kts not found inside the ZIP"; exit 1; fi
            PROJ="$(cd "$(dirname "$S")" && pwd)"
          fi
          echo "PROJ=$PROJ" >> "$GITHUB_ENV"
          echo "Project directory: $PROJ"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build components
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Bundle Urdu font (Noto Nastaliq Urdu) if not already present
        working-directory: ${{ env.PROJ }}
        run: |
          F=app/src/main/assets/fonts/NotoNastaliqUrdu-Regular.ttf
          mkdir -p "$(dirname "$F")"
          if [ ! -s "$F" ]; then
            for U in \
              "https://github.com/google/fonts/raw/main/ofl/notonastaliqurdu/NotoNastaliqUrdu%5Bwght%5D.ttf" \
              "https://github.com/notofonts/nastaliq/raw/main/fonts/NotoNastaliqUrdu/hinted/ttf/NotoNastaliqUrdu-Regular.ttf" \
              "https://github.com/notofonts/nastaliq/raw/main/fonts/NotoNastaliqUrdu/unhinted/ttf/NotoNastaliqUrdu-Regular.ttf"; do
              if curl -fL --retry 3 -o "$F" "$U" && [ -s "$F" ]; then echo "Font downloaded from $U"; break; fi
              rm -f "$F"
            done
          fi
          if [ -s "$F" ]; then ls -l "$F"; else echo "::warning::Font could not be downloaded. The app will use the phone's built-in Urdu font."; fi

      - name: Create Gradle wrapper and validate build
        working-directory: ${{ env.PROJ }}
        run: |
          gradle wrapper --gradle-version 8.7 --no-daemon
          ./gradlew --version
          ./gradlew help --no-daemon

      - name: Unit tests
        working-directory: ${{ env.PROJ }}
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Build debug APK
        working-directory: ${{ env.PROJ }}
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Decode signing key (only if secrets are set)
        id: sign
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "has_key=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_key=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release APK (signed)
        if: steps.sign.outputs.has_key == 'true'
        working-directory: ${{ env.PROJ }}
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ZCH-NewsCard-Studio-debug-apk
          path: ${{ env.PROJ }}/app/build/outputs/apk/debug/*.apk

      - name: Upload release APK
        if: steps.sign.outputs.has_key == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ZCH-NewsCard-Studio-release-apk
          path: ${{ env.PROJ }}/app/build/outputs/apk/release/*.apk

      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            ${{ env.PROJ }}/app/build/reports
            ${{ env.PROJ }}/app/build/test-results
